body:
  text: 摩竭提國三藏沙門法月重譯如是我聞一時佛在王舍大城靈鷲山中與大比丘衆滿百千人菩薩摩訶薩七萬七千人俱其名曰觀世音菩薩文殊師利菩薩彌勒菩薩等以為上首皆得三昧總持住不思議解脫爾時觀自在菩薩摩訶薩在彼敷坐於其衆中即從座起詣世尊所面向合掌曲躬恭敬瞻仰尊顏而白佛言世尊我欲於此會中説諸菩薩普遍智藏般若波羅蜜多心唯願世尊聽我所説為諸菩薩宣祕法要爾時世尊以妙梵音告觀自在菩薩摩訶薩言善哉善哉具大悲者聽汝所説與諸衆生作大光明於是觀自在菩薩摩訶薩蒙佛聽許佛所護念入於慧光三昧正受入此定已以三昧力行深般若波羅蜜多時照見五蘊自性皆空彼了知五蘊自性皆空從彼三昧安詳而起即告慧命舍利弗言善男子菩薩有般若波羅蜜多心名普遍智藏汝今諦聽善思念之吾當為汝分別解説作是語已慧命舍利弗白觀自在菩薩摩訶薩言唯大淨者願為説之今正是時於斯告舍利弗諸菩薩摩訶薩應如是學色性是空空性是色色不異空空不異色色即是空空即是色受想行識亦復如是識性是空空性是識識不異空空不異識識即是空空即是識舍利子是諸法空相不生不滅不垢不淨不增不減是故空中無色無受想行識無眼耳鼻舌身意無色聲香味觸法無眼界乃至無意識界無無明亦無無明盡乃至無老死亦無老死盡無苦集滅道無智亦無得以無所得故菩提薩埵依般若波羅蜜多故心無罣礙無罣礙故無有恐怖遠離顛倒夢想究竟涅槃三世諸佛依般若波羅蜜多故得阿耨多羅三藐三菩提故知般若波羅蜜多是大神呪是大明呪是無上呪是無等等呪能除一切苦真實不虛故説般若波羅蜜多呪即説呪曰揭諦揭諦波羅揭諦波羅僧揭諦菩提莎婆訶佛説是經已諸比丘及菩薩衆一切世間天人阿修羅乾闥婆等聞佛所説皆大歡喜信受奉行
